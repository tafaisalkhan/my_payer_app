name: mynamaz_scheduler
description: "My Namaz Scheduler - Intelligent Namaz Scheduler & Islamic Daily Planner."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  geolocator: ^13.0.2
  adhan: ^2.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_compass: ^0.8.0
  just_audio: ^0.9.46
  intl: ^0.19.0
  permission_handler: ^11.4.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/icons/
